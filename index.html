<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Gastos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header>
        <h1>Control de Gastos</h1>
        <p>Gestiona tus gastos personales con inicio de sesión de Google y Firestore en tiempo real.</p>
      </header>

      <section class="content">
        <div id="login-container" class="card">
          <div class="text-center">
            <p>Inicia sesión para ver y administrar tus gastos.</p>
            <button id="sign-in-button" class="button-primary">Iniciar sesión con Google</button>
          </div>
          <p id="login-status" class="status"></p>
        </div>

        <div id="app-container" class="hidden">
          <div class="top-bar">
            <div class="summary">
              <span id="welcome-text">Hola, usuario</span>
              <strong>Total gastado: <span id="total-gastos">$0.00</span></strong>
            </div>
            <button id="sign-out-button" class="button-secondary">Cerrar sesión</button>
          </div>

          <form id="expense-form" class="panel card">
            <div class="field">
              <label for="concepto">Concepto</label>
              <input id="concepto" name="concepto" type="text" placeholder="Descripción del gasto" required />
            </div>
            <div class="field">
              <label for="cantidad">Cantidad</label>
              <input id="cantidad" name="cantidad" type="number" step="0.01" min="0" placeholder="0.00" required />
            </div>
            <div class="field">
              <label for="fecha">Fecha</label>
              <input id="fecha" name="fecha" type="date" required />
            </div>
            <button type="submit" class="button-primary">Guardar gasto</button>
            <p id="form-status" class="status"></p>
          </form>

          <div class="card">
            <h2>Gastos recientes</h2>
            <div id="expenses-list" class="list"></div>
            <p class="footer-note">Solo se muestran tus gastos personales gracias a Firestore y filtros por usuario.</p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
